services:
  db:
    image: postgres:16-alpine
    container_name: aiorbit-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aiorbit
      POSTGRES_USER: aiorbit
      POSTGRES_PASSWORD: aiorbit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiorbit -d aiorbit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
